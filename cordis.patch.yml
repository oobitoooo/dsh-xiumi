# ============================================================================
# dsh-xiumi —— 秀米（XIUMI）图文排版自动化 skill 的 DSH bundle patch
# ============================================================================
# 把本插件插入当前 profile 的配置树；插件 apply 时会把包内 skill/ 注册成运行时 skill。
#
# 安装：
#   dsh plugin add <本目录绝对路径或 npm 包名>
# 也可在 DSH 会话里用 plugin_manager install_bundle（target 指向本目录）安装。
#
# 装好后当前 profile 的会话即可在 skill 目录里看到 xiumi-editor-automation。
# 卸载：dsh plugin remove dsh-xiumi（或 plugin_manager remove_bundle）
# ============================================================================

- insert:
    - id: dsh-xiumi
      name: dsh-xiumi
